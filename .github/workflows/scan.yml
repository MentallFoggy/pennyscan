name: pennyscan

on:
  schedule:
    # Every 15 min, Mon-Fri, ~7am-5pm Eastern (GitHub uses UTC; runs can lag a few minutes)
    - cron: "*/15 12-21 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button for a manual scan

permissions:
  contents: write

concurrency:
  group: pennyscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        run: python -m pennyscan run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Save track record + report
        run: |
          git config user.name "pennyscan-bot"
          git config user.email "pennyscan-bot@users.noreply.github.com"
          git add data/pennyscan.db REPORT.md docs/data
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
